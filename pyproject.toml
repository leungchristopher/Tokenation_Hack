[project]
name = "bo-eval"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pydantic",
    "mujoco",
    "mink",
    "daqp",
    "opencv-python",
    "anthropic>=1.11.0",
]

[project.optional-dependencies]
inspect = ["inspect_ai", "httpx"]
llm = ["httpx"]
dev = ["pytest", "ruff", "mypy", "build", "httpx"]

[dependency-groups]
dev = [
    "pytest",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bo_eval", "harness", "lab_sim", "minimal_lab", "epistemic"]

[tool.uv]

[tool.uv.sources]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
