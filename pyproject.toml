[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bo-eval"
version = "0.1.0"
description = "Two-task benchmark for epistemically aware experimental design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pydantic>=2", "scipy", "scikit-learn"]

[project.optional-dependencies]
inspect = ["inspect_ai", "httpx"]
literature = ["httpx"]
model = ["httpx"]
dev = ["pytest", "ruff", "mypy", "build", "httpx"]

[tool.setuptools]
packages = ["epistemic"]

[tool.setuptools.package-data]
epistemic = ["viewer.html"]

[tool.setuptools.data-files]
"share/bo-eval/data" = ["data/upo_abts.csv"]
"share/bo-eval/data/zimmer" = ["data/zimmer/a549_taxol_cis_dox.csv"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
