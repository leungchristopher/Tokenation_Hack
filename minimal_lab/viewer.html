<!doctype html><meta charset="utf-8"><title>Experiment decisions</title>
<style>
body{margin:0;background:#f5f4ef;color:#202824;font:15px system-ui}header{padding:24px;border-bottom:1px solid #ccc}h1{font-size:23px;margin:0 0 8px}main{display:grid;grid-template-columns: minmax(320px,1fr) minmax(320px,1fr);height:80vh}#tree{overflow:auto;padding:24px}#detail{overflow:auto;padding:24px;background:#fff}button{display:block;width:100%;text-align:left;border:1px solid #bbb;background:white;border-radius:5px;margin:10px 0;padding:14px;cursor:pointer;font:inherit}button:hover{border-color:#175844}button:focus{border-color:#175844;outline:2px solid #17584444}.deferred{margin-left:30px;width:calc(100% - 30px);background:#eee;color:#555}.source{background:#fbf7ec}.source.uncited{border-style:dashed;color:#555}h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#59635d;margin:18px 0 6px}p{line-height:1.5;margin:6px 0}blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid #a9711f;background:#faf6ec;font-size:14px}.note{border-left:3px solid #bf9d64;background:#fbf7ed;padding:10px 14px;margin:8px 0}.tag{display:inline-block;font-size:11px;border:1px solid #a9711f;color:#a9711f;border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:middle}.tag.mute{border-color:#8a958e;color:#8a958e}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace}small{color:#59635d}a{color:#175844}table{border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e6e9e4;padding:5px 8px}th{font-weight:500;color:#59635d}@media(max-width:700px){main{display:block;height:auto}}
</style>
<header><h1>Experiment decisions</h1><span id="summary"></span><br><small>Select a decision to inspect its alternatives, evidence, uncertainty and result.</small><div id="legend"></div></header>
<main><section id="tree"></section><section id="detail"></section></main>
<script>
const graph=GRAPH_DATA;
const tree=document.querySelector('#tree'), detail=document.querySelector('#detail');
const result=graph.nodes.find(n=>n.kind==='recommendation');
document.querySelector('#summary').textContent=(result?.candidate==null?'No valid result':`Best observed protocol: C${result.candidate} · mean ${result.mean.toPrecision(4)} · ${result.repeats} measurement(s)`)+` · ${graph.stop}`;
const legend=document.querySelector('#legend');
if(graph.legend?.uncertainty)for(const u of graph.legend.uncertainty){const s=document.createElement('small');s.textContent='· '+u;s.style.marginRight='14px';legend.append(s)}
const relOf=e=>e.relation||(e.reason.startsWith('Literature interpretation')?'cites':e.reason.startsWith('Retrieved but not cited')?'retrieved':e.reason.startsWith('Reconsidered')?'reconsidered':e.reason.startsWith('Not selected')?'defers':e.reason.startsWith('Executed')?'executes':e.reason.startsWith('Observed result')?'aggregates':e.reason.startsWith('No evidence')?'search_failed':'informs');
const byId=id=>graph.nodes.find(n=>n.id===id);
const srcName=s=>s.label||s.title||s.id;
const citedSources=new Set(graph.edges.filter(e=>relOf(e)==='cites').map(e=>e.source));
const num=v=>v==null?'—':Number(v).toPrecision(4);
function el(tag,text,parent,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;parent.append(e);return e}
function show(n){detail.replaceChildren();
  el('h2',(n.kind==='source'?`${n.id} · ${srcName(n)}`:n.kind)+(n.round?` · round ${n.round}`:''),detail);
  if(n.kind==='source'){const a=el(citedSources.has(n.id)?'span':'span',citedSources.has(n.id)?'cited — supports a decision':'retrieved only — not evidence',detail);a.className='tag'+(citedSources.has(n.id)?'':' mute');
    if(n.query)el('p',`Retrieved via query: “${n.query}”`,detail);
    el('p',(n.cited_in||[]).length?`Cited in round(s) ${n.cited_in.join(', ')}.`:'Never cited by a decision.',detail);}
  if(n.reason)el('p',n.reason,detail);
  if(n.rule)el('p',n.rule,detail);
  el('div',n.uncertainty||n.status||'No independent confidence estimate is available; missing confidence is not certainty.',detail,'note');
  if(n.surprise)el('div',n.surprise,detail,'note');
  if(n.fallback)el('div',`LLM selection failed (${n.fallback}); numerical policy used.`,detail,'note');
  if(n.options){el('h3','Shortlist (approximate GP — SD is not a calibrated interval)',detail);
    const t=el('table',null,detail),head=el('tr',null,t);['Candidate','Predicted','SD','EI'].forEach(h=>el('th',h,head));
    for(const o of n.options){const tr=el('tr',null,t);[ 'C'+o.candidate,num(o.mean),num(o.sd),num(o.ei)].forEach(v=>el('td',v,tr))}
    el('h3','Deferred alternatives',detail);for(const [c,why]of Object.entries(n.alternatives))el('p',`C${c}: ${why}`,detail)}
  if(n.intended&&n.reported){el('h3','Delivery report (simulated estimate, not liquid physics)',detail);
    const t=el('table',null,detail),head=el('tr',null,t);['Parameter','Intended','Reported','Report SD'].forEach(h=>el('th',h,head));
    Object.entries(n.intended).forEach(([k,v],i)=>{const tr=el('tr',null,t);[k,num(v),num(n.reported[i]),num(n.report_sd[i])].forEach(v=>el('td',v,tr))})}
  // Citations are scoped to the node that made them; an earlier quote never migrates to a later round.
  const cites=graph.edges.filter(e=>relOf(e)==='cites'&&(e.source===n.id||e.target===n.id));
  const mine=[];
  if(n.kind==='decision')for(const c of n.citations||[])mine.push({...c,round:n.round,
    branch:`C${c.candidate??n.selected} · ${(c.candidate??n.selected)===n.selected?'selected':'deferred'}`});
  if(n.kind==='deferred'){const via=graph.edges.find(e=>e.target===n.id&&relOf(e)==='defers'),d=via&&byId(via.source);
    if(d)for(const c of (d.citations||[]).filter(c=>(c.candidate??d.selected)===n.candidate))mine.push({...c,round:d.round,branch:`C${n.candidate} · deferred`});
    for(const e of cites.filter(e=>e.target===n.id)){const c=e.citation||{};if(c.quote&&!mine.some(m=>m.id===e.source&&m.quote===c.quote))mine.push({id:e.source,quote:c.quote,transfer_limit:c.transfer_limit,round:c.round,branch:`C${n.candidate} · deferred`})}}
  if(n.kind==='source')for(const e of cites.filter(e=>e.source===n.id)){const c=e.citation||{},t=byId(e.target);mine.push({id:n.id,quote:c.quote,transfer_limit:c.transfer_limit||(e.reason||'').replace('Literature interpretation: ',''),round:c.round||t?.round,to:e.target,
    branch:t?(t.kind==='deferred'?`C${t.candidate} · deferred`:`C${t.selected} · selected`):''})}
  if(mine.length){el('h3','Cited support',detail);for(const c of mine){const s=byId(c.id);
    if(s)el('p',`${s.id} · ${srcName(s)}`,detail);if(c.quote)el('blockquote',`“${c.quote}”`,detail);
    if(c.transfer_limit)el('p',`Transfer limit: ${c.transfer_limit}`,detail);
    el('p',`Round ${c.round??'?'}${c.branch?' · '+c.branch:''}${c.to?' → '+c.to:''} · qualitative support, not a verified effect.`,detail)}}
  const retrieved=graph.edges.filter(e=>relOf(e)==='retrieved'&&(e.source===n.id||e.target===n.id));
  if(retrieved.length){el('h3','Retrieved, not cited',detail);for(const e of retrieved){const s=byId(e.source===n.id?e.target:e.source);if(s?.kind==='source')el('p',`${s.id} · ${srcName(s)} — not evidence for this node.`,detail)}}
  if(n.url&&/^https:\/\//.test(n.url)){const a=document.createElement('a');a.href=n.url;a.textContent='Open source';a.target='_blank';a.rel='noopener noreferrer';detail.append(a)}
  el('h3','Edges',detail);
  for(const e of graph.edges.filter(e=>e.source===n.id||e.target===n.id)){const other=byId(e.source===n.id?e.target:e.source);if(!other)continue;const b=document.createElement('button');b.textContent=`[${relOf(e)}] ${e.reason} → ${other.kind} ${other.id}`;b.onclick=()=>show(other);detail.append(b)}
  el('h3','Raw node',detail);const pre=document.createElement('pre');pre.textContent=JSON.stringify(n,null,2);detail.append(pre)}
for(const n of graph.nodes.filter(n=>['goal','decision','deferred','recommendation','search_failure','source'].includes(n.kind))){const b=document.createElement('button');b.className=n.kind+(n.kind==='source'&&!citedSources.has(n.id)?' uncited':'');
  let text=(n.round?`Round ${n.round} · `:'')+(n.kind==='decision'?`C${n.selected} · ${n.reason}`:n.kind==='deferred'?`C${n.candidate} · ${n.reason}`:n.kind==='source'?`${n.id} · ${srcName(n)}`:n.reason||n.rule);
  const cites=n.kind==='decision'?(n.citations||[]).length:(n.cited||[]).length;
  if(n.kind==='source')text+=citedSources.has(n.id)?' [cited]':' [retrieved only]';else if(cites)text+=` [${cites} cited]`;
  if(n.surprise)text+=' [surprise]';
  b.textContent=text;b.onclick=()=>show(n);tree.append(b)}
show(result||graph.nodes[0]);
</script>
